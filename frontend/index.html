<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMR Patient Workspace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="page-title">
        <header class="page-header">
          <div>
            <p class="eyebrow">EMR Core</p>
            <h1 id="page-title">ทะเบียนผู้ป่วย</h1>
          </div>
          <div class="status-pill" id="service-status">พร้อมกรอกข้อมูล</div>
        </header>

        <nav class="tab-bar" aria-label="Patient workspace">
          <button type="button" class="tab-button active" data-view="registration">ลงทะเบียน</button>
          <button type="button" class="tab-button" data-view="search">ค้นหา / เวชระเบียน</button>
          <button type="button" class="tab-button" data-view="queue">คิวตรวจ</button>
          <button type="button" class="tab-button" data-view="admin">ตั้งค่าคลินิก</button>
        </nav>

        <section class="form-section compact" aria-labelledby="access-heading">
          <div class="section-heading">
            <h2 id="access-heading">การเชื่อมต่อ</h2>
            <span>Dev</span>
          </div>
          <div class="field-grid">
            <label>
              API Token
              <input id="apiToken" name="apiToken" autocomplete="off" />
            </label>
            <label>
              Role
              <select id="userRole" name="userRole">
                <option value="nurse">Nurse</option>
                <option value="doctor">Doctor</option>
                <option value="admin">Admin</option>
              </select>
            </label>
            <label>
              User ID
              <input id="userId" name="userId" autocomplete="off" />
            </label>
            <label>
              Practitioner ID
              <input id="actorPractitionerId" name="actorPractitionerId" autocomplete="off" />
            </label>
          </div>
        </section>

        <form id="registration-form" class="registration-form view-panel active" data-view-panel="registration">
          <section class="form-section" aria-labelledby="identity-heading">
            <div class="section-heading">
              <h2 id="identity-heading">ข้อมูลระบุตัวตน</h2>
              <span>Required</span>
            </div>
            <div class="field-grid">
              <label>
                Clinic ID
                <input id="clinicId" name="clinicId" autocomplete="off" required />
              </label>
              <label>
                HN / MRN
                <input id="medicalRecordNumber" name="medicalRecordNumber" autocomplete="off" required />
              </label>
              <label>
                เลขบัตรประชาชน
                <input id="nationalId" name="nationalId" inputmode="numeric" autocomplete="off" />
              </label>
              <label>
                เพศกำเนิด
                <select id="sexAtBirth" name="sexAtBirth">
                  <option value="unknown">ไม่ระบุ</option>
                  <option value="female">หญิง</option>
                  <option value="male">ชาย</option>
                  <option value="intersex">Intersex</option>
                </select>
              </label>
            </div>
          </section>

          <section class="form-section" aria-labelledby="name-heading">
            <div class="section-heading">
              <h2 id="name-heading">ชื่อผู้ป่วย</h2>
            </div>
            <div class="field-grid three">
              <label>
                ชื่อ
                <input id="firstName" name="firstName" autocomplete="given-name" required />
              </label>
              <label>
                ชื่อกลาง
                <input id="middleName" name="middleName" autocomplete="additional-name" />
              </label>
              <label>
                นามสกุล
                <input id="lastName" name="lastName" autocomplete="family-name" required />
              </label>
              <label>
                ชื่อที่ต้องการให้เรียก
                <input id="preferredName" name="preferredName" autocomplete="nickname" />
              </label>
              <label>
                วันเกิด
                <input id="dateOfBirth" name="dateOfBirth" type="date" />
              </label>
              <label>
                กรุ๊ปเลือด
                <input id="bloodType" name="bloodType" autocomplete="off" />
              </label>
            </div>
          </section>

          <section class="form-section" aria-labelledby="contact-heading">
            <div class="section-heading">
              <h2 id="contact-heading">ข้อมูลติดต่อ</h2>
            </div>
            <div class="field-grid">
              <label>
                โทรศัพท์
                <input id="phoneNumber" name="phoneNumber" autocomplete="tel" />
              </label>
              <label>
                อีเมล
                <input id="email" name="email" type="email" autocomplete="email" />
              </label>
            </div>
            <label class="wide-field">
              หมายเหตุ
              <textarea id="notes" name="notes" rows="4"></textarea>
            </label>
          </section>

          <footer class="action-bar">
            <button type="reset" class="secondary-button">ล้างฟอร์ม</button>
            <button type="submit" class="primary-button" id="submit-button">บันทึกผู้ป่วย</button>
          </footer>
        </form>

        <form id="patient-search-form" class="registration-form view-panel" data-view-panel="search">
          <section class="form-section" aria-labelledby="search-heading">
            <div class="section-heading">
              <h2 id="search-heading">ค้นหาผู้ป่วย</h2>
              <span>Clinic + HN</span>
            </div>
            <div class="field-grid">
              <label>
                Clinic ID
                <input id="searchClinicId" name="searchClinicId" autocomplete="off" required />
              </label>
              <label>
                HN / MRN
                <input id="searchMedicalRecordNumber" name="searchMedicalRecordNumber" autocomplete="off" required />
              </label>
            </div>
          </section>

          <footer class="action-bar">
            <button type="reset" class="secondary-button">ล้างการค้นหา</button>
            <button type="submit" class="primary-button" id="search-button">เปิดเวชระเบียน</button>
          </footer>
        </form>

        <div class="registration-form view-panel" data-view-panel="queue">
          <form id="queue-form" class="registration-form">
            <section class="form-section" aria-labelledby="queue-heading">
              <div class="section-heading">
                <h2 id="queue-heading">Queue Board</h2>
                <span>Phase 2A</span>
              </div>
              <div class="field-grid">
                <label>
                  Clinic ID
                  <input id="queueClinicId" name="queueClinicId" autocomplete="off" required />
                </label>
                <label>
                  Status
                  <select id="queueStatus" name="queueStatus">
                    <option value="">All active</option>
                    <option value="waiting">Waiting</option>
                    <option value="in_room">In room</option>
                    <option value="with_doctor">With doctor</option>
                    <option value="completed">Completed</option>
                    <option value="discharged">Discharged</option>
                    <option value="cancelled">Cancelled</option>
                  </select>
                </label>
                <label>
                  Limit
                  <input id="queueLimit" name="queueLimit" type="number" min="1" max="200" value="50" />
                </label>
                <label>
                  Practitioner ID
                  <input id="queuePractitionerId" name="queuePractitionerId" autocomplete="off" />
                </label>
                <label>
                  Room
                  <input id="queueRoomName" name="queueRoomName" autocomplete="off" />
                </label>
              </div>
            </section>

            <footer class="action-bar">
              <button type="submit" class="primary-button" id="queue-load-button">โหลดคิว</button>
            </footer>
          </form>

          <section class="form-section" id="queue-board" hidden></section>
        </div>

        <div class="registration-form view-panel" data-view-panel="admin">
          <form id="admin-form" class="registration-form">
            <section class="form-section" aria-labelledby="admin-heading">
              <div class="section-heading">
                <h2 id="admin-heading">Users / Practitioners</h2>
                <span>Admin</span>
              </div>
              <div class="field-grid">
                <label>
                  Clinic ID
                  <input id="adminClinicId" name="adminClinicId" autocomplete="off" required />
                </label>
              </div>
            </section>

            <footer class="action-bar">
              <button type="submit" class="primary-button" id="admin-load-button">โหลดทีมคลินิก</button>
            </footer>
          </form>

          <section class="form-section" id="admin-workspace" hidden></section>
        </div>
      </section>

      <aside class="result-panel" aria-live="polite">
        <div class="panel-block">
          <p class="eyebrow">Patient Snapshot</p>
          <h2 id="result-title">ยังไม่มีรายการใหม่</h2>
          <dl id="result-list" class="result-list"></dl>
        </div>
        <div class="panel-block" id="patient-detail-panel" hidden>
          <p class="eyebrow">Clinical Profile</p>
          <div id="patient-detail" class="detail-stack"></div>
        </div>
        <div class="panel-block muted">
          <p class="eyebrow">Request</p>
          <pre id="payload-preview">{}</pre>
        </div>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
